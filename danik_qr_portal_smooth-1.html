<html lang="ru">
<head>
<meta charset="UTF-8">

<title>Danik — Лунный портал</title>
<style>
*{box-sizing:border-box}
:root{color-scheme:dark}
body{margin:0;min-height:100svh;overflow:hidden;background:#060711;color:#f3f1ff;font-family:Georgia,serif}
.sky{position:fixed;inset:0;background:radial-gradient(circle at 50% 42%,#202b47 0%,#0b1021 42%,#04050b 90%)}
.stars{position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(2px 2px at 10% 20%,white 80%,transparent),radial-gradient(2px 2px at 72% 12%,white 80%,transparent),radial-gradient(2px 2px at 87% 74%,white 80%,transparent),radial-gradient(2px 2px at 22% 82%,white 80%,transparent),radial-gradient(1px 1px at 40% 65%,white 80%,transparent),radial-gradient(1px 1px at 63% 49%,white 80%,transparent);animation:twinkle 3s infinite alternate}
@keyframes twinkle{to{opacity:.25}}
.scene{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;transition:opacity 1s ease,transform 1.7s cubic-bezier(.2,.7,.1,1)}
.scene.exit{opacity:0;transform:scale(1.12);pointer-events:none}
.moon{font-size:100px;line-height:1.1;filter:drop-shadow(0 0 30px #b2c9ff90);animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-12px)}}
h1{font-weight:normal;letter-spacing:2px;font-size:clamp(27px,7vw,42px);margin:16px 0 10px}
p{line-height:1.6;color:#b3bad1;margin:0 0 26px}
button{font:inherit;cursor:pointer}
.portal{border:1px solid #a8b4da;background:linear-gradient(120deg,#292e49,#13192c,#323753);color:white;border-radius:50px;padding:17px 30px;letter-spacing:1px;box-shadow:0 0 35px #a2b8ff50;animation:pulse 2s infinite}
@keyframes pulse{50%{box-shadow:0 0 55px #b4c8ff9a;transform:scale(1.04)}}
.transition{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;z-index:5;opacity:0}
.transition.active{opacity:1}
.orb{width:90px;height:90px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#d7e6ff 45%,#8b9fc8 75%,#53658b);box-shadow:0 0 45px 12px #bed2ffb3;transform:scale(.1);opacity:0}
.transition.active .orb{animation:orb-expand 2.8s cubic-bezier(.25,.1,.2,1) forwards}
@keyframes orb-expand{0%{transform:scale(.1);opacity:0}15%{opacity:1}45%{transform:scale(1.6);opacity:1}75%{transform:scale(4);opacity:1}100%{transform:scale(45);opacity:1}}
.transition .message{position:absolute;color:#111a30;letter-spacing:3px;font-size:clamp(18px,5vw,30px);opacity:0}
.transition.active .message{animation:message-in 2.1s .7s both}
@keyframes message-in{40%{opacity:0}100%{opacity:1}}
.reveal{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;opacity:0;transform:scale(.8);pointer-events:none;transition:opacity 1.5s ease,transform 1.8s cubic-bezier(.16,1,.3,1)}
.reveal.visible{opacity:1;transform:scale(1);pointer-events:auto}
.reveal h2{font-size:clamp(25px,7vw,38px);font-weight:normal;margin:0 0 8px}
.qr{padding:15px;background:white;border-radius:20px;box-shadow:0 0 60px #a7bdff88;margin:20px 0}
.qr img{display:block;width:min(61vw,230px);height:auto}
.link{display:inline-block;text-decoration:none;color:#10182a;background:#dfe9ff;border-radius:40px;padding:14px 25px;font-weight:bold}
.back{background:transparent;color:#b6c5eb;border:0;margin-top:24px;padding:10px}
.caption{color:#b0b7d0;margin-top:8px}
@media(prefers-reduced-motion:reduce){.stars,.moon,.portal{animation:none}.transition.active .orb{animation-duration:.3s}.transition.active .message{animation:none}.scene,.reveal{transition-duration:.2s}}
</style>
</head>

<script>
const scene=document.getElementById('scene'),transition=document.getElementById('transition'),reveal=document.getElementById('reveal'),open=document.getElementById('open'),back=document.getElementById('back');
let busy=false;
open.addEventListener('click',()=>{
 if(busy)return;busy=true;open.disabled=true;
 transition.classList.remove('active');void transition.offsetWidth;
 transition.classList.add('active');
 setTimeout(()=>scene.classList.add('exit'),700);
 setTimeout(()=>{
  reveal.classList.add('visible');reveal.setAttribute('aria-hidden','false');
  transition.classList.remove('active');busy=false;open.disabled=false;
 },2850);
});
back.addEventListener('click',()=>{
 reveal.classList.remove('visible');reveal.setAttribute('aria-hidden','true');
 scene.classList.remove('exit');
});
</script>
